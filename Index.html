<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tickle</title>
    <!-- Google Fonts: Fredoka (Bold) & Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js Library (r128) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#FFFBF7',
                            surface: '#FFFFFF',
                            border: '#EFE4D8',
                            orange: '#FF7E36',
                            orangeLight: '#FFF0E6',
                            amber: '#FFB800',
                            teal: '#2DD4BF',
                            purple: '#A855F7',
                            dark: '#2D3748',
                            muted: '#718096'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Strict Zero Shadows & Zero Gradients Policy */
        * {
            box-shadow: none !important;
            text-shadow: none !important;
            background-image: none !important;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #EFE9E2;
            color: #2D3748;
        }

        .logo-font {
            font-family: 'Fredoka', sans-serif;
            letter-spacing: -0.02em;
        }

        .card-outline {
            border: 1.5px solid #EFE4D8;
        }

        .border-orange-custom {
            border: 1.5px solid #FF7E36;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #E2D6C8;
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4">

    <!-- Mobile Viewport Container -->
    <div class="w-full max-w-[420px] h-[100vh] sm:h-[880px] bg-brand-bg sm:rounded-[36px] overflow-hidden flex flex-col relative border-0 sm:border-[2px] border-stone-300">

        <!-- Top Header: Standalone Rounded Typographic Logo Only -->
        <header class="pt-4 px-5 pb-3 flex items-center justify-between z-20 bg-brand-bg sticky top-0">
            <span class="logo-font text-[28px] font-bold text-brand-orange leading-none select-none">Tickle</span>

            <div class="bg-brand-orangeLight px-3 py-1 rounded-full text-[11px] font-bold text-brand-orange whitespace-nowrap">
                <span id="headerPersonaTag">시각적 수집가</span>
            </div>
        </header>

        <!-- Main Dynamic Content Container -->
        <main id="appContent" class="flex-1 overflow-y-auto relative pb-20 px-4 pt-1">
            <!-- Rendered by JS -->
        </main>

        <!-- Bottom Navigation Bar (4 Clean Tabs: 유리병, 티끌 루틴, 메이트, 마이페이지) -->
        <nav class="absolute bottom-0 left-0 right-0 h-16 bg-white border-t border-stone-100 px-2 flex items-center justify-around z-30">
            <button data-tab="jar" class="nav-btn flex flex-col items-center justify-center flex-1 h-12 rounded-xl transition-all text-brand-orange font-bold">
                <svg class="w-5 h-5 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="6" y="8" width="12" height="13" rx="3"/>
                    <path d="M9 4h6v4H9z"/>
                </svg>
                <span class="text-[11px] mt-1 whitespace-nowrap">유리병</span>
            </button>

            <button data-tab="routines" class="nav-btn flex flex-col items-center justify-center flex-1 h-12 rounded-xl transition-all text-stone-400">
                <svg class="w-5 h-5 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="4" width="16" height="16" rx="3"/>
                    <path d="M9 12l2 2 4-4"/>
                </svg>
                <span class="text-[11px] mt-1 whitespace-nowrap">티끌 루틴</span>
            </button>

            <button data-tab="mate" class="nav-btn flex flex-col items-center justify-center flex-1 h-12 rounded-xl transition-all text-stone-400">
                <svg class="w-5 h-5 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>
                </svg>
                <span class="text-[11px] mt-1 whitespace-nowrap">메이트</span>
            </button>

            <button data-tab="mypage" class="nav-btn flex flex-col items-center justify-center flex-1 h-12 rounded-xl transition-all text-stone-400">
                <svg class="w-5 h-5 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
                </svg>
                <span class="text-[11px] mt-1 whitespace-nowrap">마이페이지</span>
            </button>
        </nav>

        <!-- Modal Overlay -->
        <div id="onboardingOverlay" class="fixed inset-0 bg-stone-900/50 z-50 flex items-center justify-center p-4 hidden">
            <div id="onboardingCard" class="bg-white w-full max-w-[360px] rounded-3xl p-5 overflow-y-auto max-h-[90vh]">
                <!-- Modal Content -->
            </div>
        </div>

        <!-- Toast Message Container -->
        <div id="toastContainer" class="pointer-events-none fixed top-16 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2"></div>
    </div>

    <!-- Application Logic Script -->
    <script>
        const STATE = {
            activeTab: 'jar',
            userPersona: 'achievement', // achievement | explorer | companion | pacekeeper
            theme: 'candyland', // candyland | ocean | christmas | halloween
            restTickets: 3,
            conditionEnergy: 80,
            difficultyMode: 'easy',
            puzzleTilesCompleted: 4,
            notifications: 'daily',
            soundEffects: true,
            shareStatus: true,
            jointGoalProgress: 6,
            mateGiftSentCount: 2,
            tickles: [],
            routines: [],
            chatMessages: [
                { sender: 'mate', text: '오늘 물 한 잔 마시기 완료했어! 너는 어떤 티끌 모았어?', time: '오전 10:12' },
                { sender: 'me', text: '나도 방금 스트레칭 5분 끝내고 유리병에 담았지!', time: '오전 10:15' }
            ]
        };

        const INITIAL_TICKLES = [
            { id: 't1', title: '아침 따뜻한 물 한 잔', theme: 'candyland' },
            { id: 't2', title: '10분 햇볕 산책하기', theme: 'candyland' },
            { id: 't3', title: '책 3페이지 읽기', theme: 'candyland' },
            { id: 't4', title: '어깨 스트레칭 5분', theme: 'candyland' }
        ];

        const INITIAL_ROUTINES = [
            { id: 'r1', easyTitle: '물 반 컵 가볍게 마시기 (30초)', title: '아침 물 1잔 온전히 마시기', category: '건강', completed: true },
            { id: 'r2', easyTitle: '창문 열고 심호흡 3번 하기 (1분)', title: '창문 열고 맑은 공기 5분 쐬기', category: '기분전환', completed: true },
            { id: 'r3', easyTitle: '좋아하는 노래 하이라이트 1분 듣기', title: '좋아하는 음악 1곡 가사에 집중해 듣기', category: '휴식', completed: false },
            { id: 'r4', easyTitle: '오늘 기분 한 단어로 적어보기', title: '오늘 나에게 다정한 응원 한 줄 써주기', category: '마음', completed: false }
        ];

        let threeApp = null;

        function initApp() {
            loadStorage();
            bindNavEvents();

            if (!STATE.userPersona) {
                showOnboardingQuiz();
            } else {
                renderTab(STATE.activeTab);
            }
        }

        function loadStorage() {
            const saved = localStorage.getItem('tickle_app_v11');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    Object.assign(STATE, parsed);
                } catch(e){}
            }
            if (!STATE.tickles || STATE.tickles.length === 0) STATE.tickles = [...INITIAL_TICKLES];
            if (!STATE.routines || STATE.routines.length === 0) STATE.routines = [...INITIAL_ROUTINES];
        }

        function saveStorage() {
            localStorage.setItem('tickle_app_v11', JSON.stringify({
                userPersona: STATE.userPersona,
                theme: STATE.theme,
                restTickets: STATE.restTickets,
                conditionEnergy: STATE.conditionEnergy,
                difficultyMode: STATE.difficultyMode,
                puzzleTilesCompleted: STATE.puzzleTilesCompleted,
                notifications: STATE.notifications,
                soundEffects: STATE.soundEffects,
                shareStatus: STATE.shareStatus,
                jointGoalProgress: STATE.jointGoalProgress,
                mateGiftSentCount: STATE.mateGiftSentCount,
                tickles: STATE.tickles,
                routines: STATE.routines,
                chatMessages: STATE.chatMessages
            }));
        }

        function bindNavEvents() {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const tab = btn.dataset.tab;
                    if (tab === STATE.activeTab) return;
                    switchTab(tab);
                });
            });
        }

        function switchTab(tab) {
            STATE.activeTab = tab;
            document.querySelectorAll('.nav-btn').forEach(b => {
                const active = b.dataset.tab === tab;
                b.classList.toggle('text-brand-orange', active);
                b.classList.toggle('font-bold', active);
                b.classList.toggle('text-stone-400', !active);
            });
            renderTab(tab);
        }

        function renderTab(tab) {
            if (threeApp && tab !== 'jar') {
                threeApp.destroy();
                threeApp = null;
            }

            const main = document.getElementById('appContent');
            updateHeaderPersonaTag();

            switch(tab) {
                case 'jar':
                    main.innerHTML = getJarTabHTML();
                    initJarTabEvents();
                    break;
                case 'routines':
                    main.innerHTML = getRoutinesTabHTML();
                    initRoutinesTabEvents();
                    break;
                case 'mate':
                    main.innerHTML = getMateTabHTML();
                    initMateTabEvents();
                    break;
                case 'mypage':
                    main.innerHTML = getMyPageTabHTML();
                    initMyPageTabEvents();
                    break;
            }
        }

        function getPersonaName(p) {
            const names = {
                achievement: '시각적 수집가',
                explorer: '작은 성취 탐험가',
                companion: '따뜻한 공감러',
                pacekeeper: '나만의 페이스 메이커'
            };
            return names[p || STATE.userPersona] || '시각적 수집가';
        }

        function updateHeaderPersonaTag() {
            const tag = document.getElementById('headerPersonaTag');
            if (tag) tag.innerText = getPersonaName();
        }

        // ========================================================
        // 1. ONBOARDING & CLEAN DEFAULT SILHOUETTE PROFILE ICON
        // ========================================================
        function showOnboardingQuiz() {
            const overlay = document.getElementById('onboardingOverlay');
            const card = document.getElementById('onboardingCard');
            overlay.classList.remove('hidden');

            const questions = [
                {
                    q: '1. 목표를 실천할 때 가장 즐거움을 느끼는 순간은?',
                    options: [
                        { v: 'achievement', text: '눈에 보이는 퍼즐 조각이나 수집품이 하나씩 채워질 때' },
                        { v: 'explorer', text: '콤보가 쌓이고 목표 난이도를 내 손으로 직접 조절할 때' },
                        { v: 'companion', text: '메이트와 함께 공동 목표를 채우고 서로 응원할 때' },
                        { v: 'pacekeeper', text: '독촉 없이 오늘 내 컨디션에 맞춰 편안하게 움직일 때' }
                    ]
                },
                {
                    q: '2. 의욕이 떨어지는 날, 나에게 가장 필요한 처방은?',
                    options: [
                        { v: 'pacekeeper', text: '휴식 티켓을 써서 죄책감 없이 온전히 하루 쉬어가기' },
                        { v: 'companion', text: '메이트에게 다정한 콕 찌르기 응원 메시지 받기' },
                        { v: 'explorer', text: '1단계 3분짜리 아주 가벼운 미션으로 난이도 낮추기' },
                        { v: 'achievement', text: '유리병 속 테마 소품을 바꾸며 시각적 기분 전환하기' }
                    ]
                },
                {
                    q: '3. 새로운 습관을 들일 때 내가 선호하는 방식은?',
                    options: [
                        { v: 'explorer', text: '작은 단계부터 시작해 조금씩 레벨업하며 도전하기' },
                        { v: 'achievement', text: '매일 달성한 흔적을 예쁜 오브제로 차곡차곡 모으기' },
                        { v: 'pacekeeper', text: '정해진 규칙보다 그날의 에너지에 따라 유연하게 조절하기' },
                        { v: 'companion', text: '누군가와 같이 시작해서 서로의 진행 상황을 공유하기' }
                    ]
                },
                {
                    q: '4. 작은 성취를 이루었을 때 가장 뿌듯한 보상은?',
                    options: [
                        { v: 'achievement', text: '유리병이 다채로운 소품으로 꽉 채워지는 뿌듯한 장면' },
                        { v: 'companion', text: '메이트가 내 기록을 보고 하트와 축하를 보내줄 때' },
                        { v: 'explorer', text: '스스로 정한 오늘의 목표 난이도를 완벽히 클리어했을 때' },
                        { v: 'pacekeeper', text: '무리하지 않고 나만의 속도를 끝까지 지켜냈다는 안도감' }
                    ]
                },
                {
                    q: '5. 내가 꿈꾸는 가장 이상적인 루틴의 모습은?',
                    options: [
                        { v: 'pacekeeper', text: '지치지 않고 오랫동안 잔잔하게 이어가는 나만의 리듬' },
                        { v: 'achievement', text: '하루하루의 조각이 모여 하나의 완성된 작품이 되는 과정' },
                        { v: 'companion', text: '혼자가 아니라 함께 걸으며 따뜻함을 나누는 시간' },
                        { v: 'explorer', text: '매일 새로운 작은 퀘스트를 깨듯 재미있게 탐험하는 일상' }
                    ]
                }
            ];

            let currentStep = 0;
            const answers = new Array(questions.length).fill(null);
            answers[0] = questions[0].options[0].v;

            const renderStep = () => {
                const item = questions[currentStep];
                if (!answers[currentStep]) {
                    answers[currentStep] = item.options[0].v;
                }
                const progressPct = ((currentStep + 1) / questions.length) * 100;

                card.innerHTML = `
                    <div class="text-center mb-3.5">
                        <div class="flex items-center justify-between mb-2">
                            <span class="bg-brand-orangeLight text-brand-orange border border-orange-custom px-2.5 py-0.5 rounded-full text-[11px] font-bold">
                                맞춤 성향 진단
                            </span>
                            <span class="text-[11px] font-black text-brand-orange">${currentStep + 1} / ${questions.length}</span>
                        </div>
                        <div class="w-full h-1.5 bg-stone-100 rounded-full overflow-hidden mb-3">
                            <div class="h-full bg-brand-orange rounded-full transition-all duration-300" style="width: ${progressPct}%"></div>
                        </div>
                        <h2 class="text-base font-bold text-stone-800">나에게 맞는 동기부여 방식 찾기</h2>
                        <p class="text-[11px] text-stone-500 mt-0.5">5가지 질문으로 나만의 맞춤 동기부여 유형을 분석해요.</p>
                    </div>

                    <div class="space-y-3">
                        <p class="text-xs font-bold text-stone-800 leading-relaxed">${item.q}</p>
                        <div class="space-y-2">
                            ${item.options.map((opt) => {
                                const isSelected = answers[currentStep] === opt.v;
                                return `
                                    <button type="button" data-val="${opt.v}" class="quiz-opt-btn w-full text-left flex items-center p-3 rounded-2xl transition-all text-xs font-medium outline-none focus:outline-none ${isSelected ? 'bg-brand-orangeLight border-orange-custom text-stone-800 font-bold' : 'bg-stone-50 hover:bg-stone-100 text-stone-600 border border-transparent'}">
                                        <span class="w-4 h-4 rounded-full flex items-center justify-center mr-3 shrink-0 transition-all ${isSelected ? 'border-[2px] border-brand-orange bg-white' : 'border-[1.5px] border-stone-300 bg-white'}">
                                            ${isSelected ? '<span class="w-2 h-2 rounded-full bg-brand-orange"></span>' : ''}
                                        </span>
                                        <span class="leading-snug">${opt.text}</span>
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <div class="flex items-center gap-2 mt-5">
                        ${currentStep > 0 ? `
                            <button type="button" id="quizPrevBtn" class="px-4 py-3 rounded-2xl bg-stone-100 hover:bg-stone-200 text-stone-600 font-bold text-xs outline-none">
                                이전
                            </button>
                        ` : ''}
                        <button type="button" id="quizNextBtn" class="flex-1 bg-brand-orange hover:bg-orange-600 text-white font-bold py-3 rounded-2xl text-xs outline-none">
                            ${currentStep < questions.length - 1 ? '다음 질문으로' : '나만의 성향 결과 확인하기'}
                        </button>
                    </div>
                `;

                card.querySelectorAll('.quiz-opt-btn').forEach(btn => {
                    btn.onclick = () => {
                        answers[currentStep] = btn.dataset.val;
                        renderStep();
                    };
                });

                const prevBtn = document.getElementById('quizPrevBtn');
                if (prevBtn) {
                    prevBtn.onclick = () => {
                        currentStep--;
                        renderStep();
                    };
                }

                document.getElementById('quizNextBtn').onclick = () => {
                    if (currentStep < questions.length - 1) {
                        currentStep++;
                        renderStep();
                    } else {
                        const counts = { achievement: 0, explorer: 0, companion: 0, pacekeeper: 0 };
                        answers.forEach(v => { if (counts[v] !== undefined) counts[v]++; });
                        let bestPersona = answers[0] || 'achievement';
                        let maxScore = -1;
                        Object.entries(counts).forEach(([k, score]) => {
                            if (score > maxScore) {
                                maxScore = score;
                                bestPersona = k;
                            }
                        });

                        STATE.userPersona = bestPersona;
                        saveStorage();
                        closeModal();
                        showToast(`진단 완료! '${getPersonaName(bestPersona)}' 성향으로 설정되었습니다.`);
                        renderTab(STATE.activeTab);
                    }
                };
            };

            renderStep();
        }

        // Default Minimalist Human Silhouette Profile Icons (Clipped cleanly to circle)
        function render2DAvatarSVG(persona, size = 64) {
            const clipId = 'clip_' + Math.random().toString(36).substr(2, 9);
            return `
                <svg width="${size}" height="${size}" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <clipPath id="${clipId}">
                            <circle cx="50" cy="50" r="48"/>
                        </clipPath>
                    </defs>
                    <g clip-path="url(#${clipId})">
                        <circle cx="50" cy="50" r="48" fill="#D5DADE"/>
                        <circle cx="50" cy="39" r="19" fill="#B0B7BD"/>
                        <ellipse cx="50" cy="87" rx="34" ry="27" fill="#B0B7BD"/>
                    </g>
                </svg>
            `;
        }

        // 2D SVG Theme Backdrops
        function getThemeBackdropSVG(theme) {
            if (theme === 'candyland') {
                return `
                    <svg class="absolute inset-0 w-full h-full object-cover z-0 pointer-events-none" viewBox="0 0 350 450" preserveAspectRatio="xMidYMid slice" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <clipPath id="candyCaneLeftClip">
                                <path d="M26 285 V185 A18 18 0 0 1 62 185 V202" stroke-width="11" stroke-linecap="round"/>
                            </clipPath>
                            <clipPath id="candyCaneRightClip">
                                <path d="M322 295 V195 A18 18 0 0 0 286 195 V212" stroke-width="11" stroke-linecap="round"/>
                            </clipPath>
                        </defs>

                        <!-- Pastel Sky Background -->
                        <rect width="350" height="450" fill="#FFF0F6"/>
                        <!-- Soft Pastel Clouds -->
                        <g fill="#FFFFFF" opacity="0.88">
                            <circle cx="52" cy="58" r="16"/><circle cx="70" cy="53" r="20"/><circle cx="88" cy="59" r="15"/>
                            <rect x="48" y="58" width="44" height="16" rx="8"/>
                            <circle cx="262" cy="72" r="14"/><circle cx="278" cy="67" r="18"/><circle cx="294" cy="73" r="13"/>
                            <rect x="258" y="72" width="40" height="14" rx="7"/>
                        </g>

                        <!-- Rolling Candy Hills -->
                        <path d="M-10 265 Q80 220 175 250 T360 235 V450 H-10 Z" fill="#FCE7F3"/>
                        <path d="M-10 315 Q100 280 200 305 T360 290 V450 H-10 Z" fill="#FBCFE8"/>
                        <path d="M-10 365 Q90 345 190 360 T360 350 V450 H-10 Z" fill="#FFF5F9"/>

                        <!-- Smooth Striped Candy Cane (Left) -->
                        <g>

            document.querySelectorAll('.theme-btn').forEach(btn => {

                    renderTab('jar');
                };
            });

            document.getElementById('shakeJarBtn').onclick = () => {
                if (threeApp) threeApp.shakeObjects();
            };

            document.getElementById('addTickleBtn').onclick = () => showAddTickleModal();

            const container = document.getElementById('threeContainer');
            if (container) {
                threeApp = new ThreeJarScene(container, STATE.theme, STATE.tickles);

        // ========================================================
        // THREE.JS 3D GLASS JAR SCENE & ACCURATE SCULPTED MODELS
        // ========================================================
        class ThreeJarScene {
            constructor(container, theme, tickles) {
                this.container = container;
                this.theme = theme;
                this.tickles = tickles;
                this.objects = [];
                this.draggedObj = null;
                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();
                this.dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
                this.prevMouse3D = new THREE.Vector3();
                this.velocity3D = new THREE.Vector3();
                this.shakeTime = 0;
                this.animId = null;

                this.width = container.clientWidth || 350;
                this.height = container.clientHeight || 375;

                // Jar Bounds
                this.jarRadius = 1.65;
                this.floorTopY = -1.72;
                this.jarTop = 1.48;

                this.initScene();
                this.buildJarAndEnvironment();
                this.spawnTickleObjects();
                this.bindPointerEvents();
                this.animate();
            }

            initScene() {
                this.scene = new THREE.Scene();
                this.scene.background = null;

                this.camera = new THREE.PerspectiveCamera(36, this.width / this.height, 0.1, 100);
                this.updateCameraFit();

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.renderer.setClearColor(0x000000, 0);
                this.renderer.setSize(this.width, this.height);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

                this.renderer.domElement.className = "relative z-10 w-full h-full pointer-events-auto";
                this.renderer.domElement.style.transform = "translateZ(0)";
                this.container.appendChild(this.renderer.domElement);

                this.resizeObserver = new ResizeObserver(() => {
                    if (!this.container) return;
                    const newW = this.container.clientWidth;
                    const newH = this.container.clientHeight;
                    if (newW > 0 && newH > 0 && (newW !== this.width || newH !== this.height)) {
                        this.width = newW;
                        this.height = newH;
                        this.camera.aspect = this.width / this.height;
                        this.updateCameraFit();
                        this.renderer.setSize(this.width, this.height);
                    }
                });
                this.resizeObserver.observe(this.container);

                // Clean Lighting
                const hemiLight = new THREE.HemisphereLight(0xFFFFFF, 0xF3E8DF, 0.95);
                hemiLight.position.set(0, 6, 0);
                this.scene.add(hemiLight);

                const dirLight = new THREE.DirectionalLight(0xFFFFFF, 0.65);
                dirLight.position.set(3, 5, 5);
                this.scene.add(dirLight);
            }

            updateCameraFit() {
                const aspect = this.width / this.height;
                const baseZ = aspect < 0.85 ? 7.6 + (0.85 - aspect) * 2.2 : 7.6;
                this.camera.position.set(0, 0.22, baseZ);
                this.camera.lookAt(0, -0.05, 0);
                this.camera.updateProjectionMatrix();
            }

            buildJarAndEnvironment() {
                const glassMat = new THREE.MeshPhysicalMaterial({
                    color: 0xF1F5F9,
                    transparent: true,
                    opacity: 0.26,
                    roughness: 0.1,
                    metalness: 0.05,
                    depthWrite: false
                });

                // Glass Body
                const jarHeight = this.jarTop - this.floorTopY;
                const jarCenterY = (this.jarTop + this.floorTopY) / 2;
                const bodyMesh = new THREE.Mesh(
                    new THREE.CylinderGeometry(this.jarRadius, this.jarRadius, jarHeight, 48, 1, true),
                    glassMat
                );
                bodyMesh.position.y = jarCenterY;
                bodyMesh.renderOrder = 10;
                this.scene.add(bodyMesh);

                // Theme Floor Layers (Inside Jar)
                let floorColor = 0xE2E8F0;
                if (this.theme === 'candyland') floorColor = 0xFCE7F3;
                else if (this.theme === 'ocean') floorColor = 0xFEF08A;
                else if (this.theme === 'christmas') floorColor = 0xF8FAFC;
                else if (this.theme === 'halloween') floorColor = 0x581C87;

                const floorMesh = new THREE.Mesh(
                    new THREE.CylinderGeometry(this.jarRadius * 0.98, this.jarRadius * 0.98, 0.16, 40),
                    new THREE.MeshStandardMaterial({ color: floorColor, roughness: 0.5 })
                );
                floorMesh.position.y = this.floorTopY - 0.08;
                this.scene.add(floorMesh);

                // Outer Glass Base Plate
                const baseMesh = new THREE.Mesh(
                    new THREE.CylinderGeometry(this.jarRadius + 0.06, this.jarRadius + 0.06, 0.22, 48),
                    new THREE.MeshStandardMaterial({ color: 0xE2E8F0, roughness: 0.3, transparent: true, opacity: 0.6, depthWrite: false })
                );
                baseMesh.position.y = this.floorTopY - 0.27;
                baseMesh.renderOrder = 9;
                this.scene.add(baseMesh);

                // Glass Rim
                const rimMesh = new THREE.Mesh(
                    new THREE.TorusGeometry(this.jarRadius + 0.03, 0.07, 16, 48),
                    new THREE.MeshStandardMaterial({ color: 0xCBD5E1, roughness: 0.25 })
                );
                rimMesh.rotation.x = Math.PI / 2;
                rimMesh.position.y = this.jarTop;
                rimMesh.renderOrder = 11;
                this.scene.add(rimMesh);

                // Cork Stopper
                const corkMesh = new THREE.Mesh(
                    new THREE.CylinderGeometry(this.jarRadius * 0.88, this.jarRadius * 0.80, 0.42, 40),
                    new THREE.MeshStandardMaterial({ color: 0xD6B48C, roughness: 0.78 })
                );
                corkMesh.position.y = this.jarTop + 0.18;
                corkMesh.renderOrder = 12;
                this.scene.add(corkMesh);
            }

            // High-Detail Sculpted 3D Models
            createTheme3DModel(theme, idx) {
                const group = new THREE.Group();
                const radius = 0.44;
                const mat = (col, rough = 0.42) => new THREE.MeshStandardMaterial({ color: col, roughness: rough });

                if (theme === 'candyland') {
                    const variant = idx % 4;
                    if (variant === 0) {
                        // Striped Donut
                        const dough = new THREE.Mesh(new THREE.TorusGeometry(0.27, 0.145, 20, 32), mat(0xFFFBEB));
                        group.add(dough);
                        for (let s = 0; s < 8; s++) {
                            const stripe = new THREE.Mesh(
                                new THREE.TorusGeometry(0.27, 0.15, 16, 12, Math.PI / 8),
                                mat(0xF472B6)
                            );
                            stripe.rotation.z = (s / 8) * Math.PI * 2;
                            group.add(stripe);
                        }
                    } else if (variant === 1) {
                        // Chocolate Cake with Dripping Pink Glaze & Sprinkles
                        const cake = new THREE.Mesh(new THREE.CylinderGeometry(0.31, 0.31, 0.34, 28), mat(0x5C2D16));
                        const midCream = new THREE.Mesh(new THREE.CylinderGeometry(0.315, 0.315, 0.05, 28), mat(0xFDBA74));
                        const topGlaze = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.11, 28), mat(0xFB7185));
                        topGlaze.position.y = 0.14;
                        group.add(cake, midCream, topGlaze);
                        const spColors = [0xFACC15, 0x38BDF8, 0xA855F7, 0x4ADE80, 0xFFFFFF];
                        for (let i = 0; i < 8; i++) {
                            const ang = (i / 8) * Math.PI * 2;
                            const drip = new THREE.Mesh(new THREE.SphereGeometry(0.042, 10, 10), mat(0xFB7185));
                            drip.scale.y = 1.6;
                            drip.position.set(Math.cos(ang) * 0.31, 0.07, Math.sin(ang) * 0.31);
                            const sp = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.07, 8), mat(spColors[i % spColors.length]));
                            sp.rotation.set(0.5, ang, 0.8);
                            sp.position.set(Math.cos(ang) * 0.16, 0.21, Math.sin(ang) * 0.16);
                            group.add(drip, sp);
                        }
                    } else if (variant === 2) {
                        // Strawberry with 8-leaf calyx & yellow seeds
                        const berry = new THREE.Mesh(new THREE.LatheGeometry([

            spawnTickleObjects() {
                this.tickles.forEach((t, idx) => {
                    const mesh = this.createTheme3DModel(this.theme, idx);
                    const r = mesh.userData.radius;
                    const angle = idx * 1.4;
                    const dist = (idx % 2 === 0 ? 0.52 : 0.92);
                    mesh.position.set(
                        Math.cos(angle) * dist,
                        this.floorTopY + r + idx * 0.52,
                        Math.sin(angle) * dist
                    );
                    Object.assign(mesh.userData, {
                        vx: 0,
                        vy: 0,
                        vz: 0,
                        rotVx: 0,
                        rotVy: 0,
                        tickleData: t
                    });
                    this.scene.add(mesh);
                    this.objects.push(mesh);
                });
            }

            addSingleObject(tickle) {
                const mesh = this.createTheme3DModel(this.theme, this.objects.length);
                const r = mesh.userData.radius;
                mesh.position.set((Math.random() - 0.5) * 0.6, this.jarTop - r - 0.1, (Math.random() - 0.5) * 0.6);
                Object.assign(mesh.userData, {
                    vx: (Math.random() - 0.5) * 0.04,
                    vy: -0.02,
                    vz: (Math.random() - 0.5) * 0.04,
                    rotVx: 0.03,
                    rotVy: 0.03,
                    tickleData: tickle
                });
                this.scene.add(mesh);
                this.objects.push(mesh);
            }

            shakeObjects() {
                this.shakeTime = 0.45;
                this.objects.forEach(obj => {
                    obj.userData.vy = 0.22 + Math.random() * 0.12;
                    obj.userData.vx = (Math.random() - 0.5) * 0.20;
                    obj.userData.vz = (Math.random() - 0.5) * 0.20;
                    obj.userData.rotVx = (Math.random() - 0.5) * 0.12;
                    obj.userData.rotVy = (Math.random() - 0.5) * 0.12;
                });
            }

            bindPointerEvents() {
                const dom = this.renderer.domElement;

                const getPointerPos = (e) => {
                    const rect = dom.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    return {
                        x: ((clientX - rect.left) / this.width) * 2 - 1,
                        y: -((clientY - rect.top) / this.height) * 2 + 1
                    };
                };

                const onDown = (e) => {
                    const pos = getPointerPos(e);
                    this.mouse.set(pos.x, pos.y);
                    this.raycaster.setFromCamera(this.mouse, this.camera);

                    const intersects = this.raycaster.intersectObjects(this.objects, true);
                    if (intersects.length > 0) {
                        let target = intersects[0].object;
                        while (target.parent && target.parent !== this.scene) {
                            target = target.parent;
                        }
                        this.draggedObj = target;
                        this.dragPlane.setFromNormalAndCoplanarPoint(
                            this.camera.getWorldDirection(new THREE.Vector3()).negate(),
                            this.draggedObj.position
                        );
                        const rayPoint = new THREE.Vector3();
                        this.raycaster.ray.intersectPlane(this.dragPlane, rayPoint);
                        this.prevMouse3D.copy(rayPoint);
                    }
                };

                const onMove = (e) => {
                    if (!this.draggedObj) return;
                    const pos = getPointerPos(e);
                    this.mouse.set(pos.x, pos.y);
                    this.raycaster.setFromCamera(this.mouse, this.camera);

                    const currentMouse3D = new THREE.Vector3();
                    if (this.raycaster.ray.intersectPlane(this.dragPlane, currentMouse3D)) {
                        this.velocity3D.subVectors(currentMouse3D, this.prevMouse3D);
                        this.draggedObj.position.copy(currentMouse3D);
                        this.prevMouse3D.copy(currentMouse3D);

                        const r = this.draggedObj.userData.radius || 0.4;
                        const maxCylR = this.jarRadius - r - 0.05;
                        const dist = Math.hypot(this.draggedObj.position.x, this.draggedObj.position.z);
                        if (dist > maxCylR) {
                            const angle = Math.atan2(this.draggedObj.position.z, this.draggedObj.position.x);
                            this.draggedObj.position.x = Math.cos(angle) * maxCylR;
                            this.draggedObj.position.z = Math.sin(angle) * maxCylR;
                        }
                        this.draggedObj.position.y = Math.max(this.floorTopY + r, Math.min(this.jarTop - r, this.draggedObj.position.y));
                    }
                };

                const onUp = () => {
                    if (this.draggedObj) {
                        this.draggedObj.userData.vx = Math.max(-0.3, Math.min(0.3, this.velocity3D.x * 0.85));
                        this.draggedObj.userData.vy = Math.max(-0.3, Math.min(0.3, this.velocity3D.y * 0.85));
                        this.draggedObj.userData.vz = Math.max(-0.3, Math.min(0.3, this.velocity3D.z * 0.85));
                        this.draggedObj = null;
                    }
                };

                dom.addEventListener('mousedown', onDown);
                dom.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);

                dom.addEventListener('touchstart', onDown, { passive: true });
                dom.addEventListener('touchmove', onMove, { passive: true });
                window.addEventListener('touchend', onUp, { passive: true });
            }

            animate() {
                this.animId = requestAnimationFrame(() => this.animate());

                if (this.shakeTime > 0) {
                    this.shakeTime = Math.max(0, this.shakeTime - 0.016);
                    const decay = this.shakeTime / 0.45;
                    const wave = Math.sin(this.shakeTime * 42) * decay;
                    this.scene.position.x = wave * 0.14;
                    this.scene.rotation.z = wave * 0.045;
                } else if (this.scene.position.x !== 0 || this.scene.rotation.z !== 0) {
                    this.scene.position.x = 0;
                    this.scene.rotation.z = 0;
                }

                const gravity = -0.009;

                for (let i = 0; i < this.objects.length; i++) {
                    const obj = this.objects[i];
                    if (obj === this.draggedObj) continue;

                    const u = obj.userData;
                    const r = u.radius || 0.42;

                    u.vy += gravity;
                    obj.position.x += u.vx;
                    obj.position.y += u.vy;
                    obj.position.z += u.vz;

                    obj.rotation.x += u.rotVx;
                    obj.rotation.y += u.rotVy;
                    u.rotVx *= 0.88;
                    u.rotVy *= 0.88;

                    u.vx *= 0.94;
                    u.vz *= 0.94;

                    // Bouncy Restitution Floor Collision
                    if (obj.position.y < this.floorTopY + r) {
                        obj.position.y = this.floorTopY + r;
                        if (Math.abs(u.vy) < 0.025) {
                            u.vy = 0;
                            u.vx *= 0.7;
                            u.vz *= 0.7;
                        } else {
                            u.vy *= -0.68;
                        }
                    }

                    // Strict Cork-Lid Ceiling Collision (Prevents 3D items from clipping through cork)
                    const maxTopY = this.jarTop - r - 0.05;
                    if (obj.position.y > maxTopY) {
                        obj.position.y = maxTopY;
                        u.vy *= -0.60;
                    }

                    const maxR = this.jarRadius - r - 0.04;
                    const distR = Math.hypot(obj.position.x, obj.position.z);
                    if (distR > maxR) {
                        const angle = Math.atan2(obj.position.z, obj.position.x);
                        obj.position.x = Math.cos(angle) * maxR;
                        obj.position.z = Math.sin(angle) * maxR;
                        u.vx *= -0.65;
                        u.vz *= -0.65;
                    }
                }

                // Inter-object collisions
                for (let i = 0; i < this.objects.length; i++) {
                    for (let j = i + 1; j < this.objects.length; j++) {
                        const a = this.objects[i];
                        const b = this.objects[j];
                        const rA = a.userData.radius || 0.42;
                        const rB = b.userData.radius || 0.42;
                        const minDist = (rA + rB) * 0.92;

                        const dx = b.position.x - a.position.x;
                        const dy = b.position.y - a.position.y;
                        const dz = b.position.z - a.position.z;
                        const dist = Math.hypot(dx, dy, dz);

                        if (dist > 0.0001 && dist < minDist) {
                            const overlap = (minDist - dist) * 0.5;
                            const nx = dx / dist;
                            const ny = dy / dist;
                            const nz = dz / dist;

                            if (a !== this.draggedObj) {
                                a.position.x -= nx * overlap;
                                a.position.y = Math.max(this.floorTopY + rA, a.position.y - ny * overlap);
                                a.position.z -= nz * overlap;
                            }
                            if (b !== this.draggedObj) {
                                b.position.x += nx * overlap;
                                b.position.y = Math.max(this.floorTopY + rB, b.position.y + ny * overlap);
                                b.position.z += nz * overlap;
                            }
                        }
                    }
                }

                this.renderer.render(this.scene, this.camera);
            }

            destroy() {
                if (this.resizeObserver) this.resizeObserver.disconnect();
                if (this.animId) cancelAnimationFrame(this.animId);
                if (this.renderer && this.renderer.domElement && this.renderer.domElement.parentNode) {
                    this.container.removeChild(this.renderer.domElement);
                }
            }
        }

                            <div>
                                <span class="text-xs font-bold text-stone-700 block">루틴 알림 주기</span>
                                <span class="text-[10px] text-stone-400">목표 실천 리마인더</span>
                            </div>
                            <div class="relative">
                                <button id="customNotifDropdownBtn" class="bg-stone-50 border border-stone-200 rounded-xl px-3 py-1.5 text-xs font-bold text-stone-700 flex items-center gap-1.5 hover:bg-stone-100 transition-all">
                                    <span id="customNotifText">${getNotifText(STATE.notifications)}</span>
                                    <svg class="w-3.5 h-3.5 text-stone-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path d="M19 9l-7 7-7-7"/></svg>
                                </button>
                                <div id="customNotifMenu" class="hidden absolute right-0 mt-1.5 w-44 bg-white border border-stone-200 rounded-2xl p-1.5 z-40 space-y-1">
                                    <button data-val="daily" class="notif-opt-btn w-full text-left px-3 py-2 rounded-xl text-xs font-bold flex items-center justify-between ${STATE.notifications==='daily'?'bg-orange-50 text-brand-orange':'text-stone-700 hover:bg-stone-50'}">
                                        <span>하루 1회 (오후 8시)</span>
                                        ${STATE.notifications==='daily'?'<svg class="w-3.5 h-3.5 fill-current text-brand-orange" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>':''}
                                    </button>
                                    <button data-val="twice" class="notif-opt-btn w-full text-left px-3 py-2 rounded-xl text-xs font-bold flex items-center justify-between ${STATE.notifications==='twice'?'bg-orange-50 text-brand-orange':'text-stone-700 hover:bg-stone-50'}">
                                        <span>아침·저녁 2회</span>
                                        ${STATE.notifications==='twice'?'<svg class="w-3.5 h-3.5 fill-current text-brand-orange" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>':''}
                                    </button>
                                    <button data-val="off" class="notif-opt-btn w-full text-left px-3 py-2 rounded-xl text-xs font-bold flex items-center justify-between ${STATE.notifications==='off'?'bg-orange-50 text-brand-orange':'text-stone-700 hover:bg-stone-50'}">
                                        <span>방해금지</span>
                                        ${STATE.notifications==='off'?'<svg class="w-3.5 h-3.5 fill-current text-brand-orange" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>':''}
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center justify-between py-1.5 border-b border-stone-50">
                            <div>
                                <span class="text-xs font-bold text-stone-700 block">유리병 효과음 및 물리 진동</span>
                                <span class="text-[10px] text-stone-400">티끌 충돌 반응</span>
                            </div>
                            <button id="toggleSoundBtn" class="w-11 h-6 rounded-full transition-colors ${STATE.soundEffects ? 'bg-brand-orange' : 'bg-stone-200'} relative p-0.5">
                                <div class="w-5 h-5 rounded-full bg-white transition-transform ${STATE.soundEffects ? 'translate-x-5' : 'translate-x-0'}"></div>
                            </button>
                        </div>

                        <div class="flex items-center justify-between py-1.5 border-b border-stone-50">
                            <div>
                                <span class="text-xs font-bold text-stone-700 block">메이트에게 나의 활동 상태 공개</span>
                                <span class="text-[10px] text-stone-400">실시간 루틴 완료 여부</span>
                            </div>
                            <button id="toggleShareBtn" class="w-11 h-6 rounded-full transition-colors ${STATE.shareStatus ? 'bg-brand-orange' : 'bg-stone-200'} relative p-0.5">
                                <div class="w-5 h-5 rounded-full bg-white transition-transform ${STATE.shareStatus ? 'translate-x-5' : 'translate-x-0'}"></div>
                            </button>
                        </div>

                        <div class="pt-1 space-y-2">
                            <button id="retestQuizBtn2" class="w-full bg-stone-50 text-stone-700 font-bold py-2.5 rounded-xl text-xs hover:bg-stone-100 flex items-center justify-center gap-1.5">
                                <span>내 성향 다시 진단하기</span>
                            </button>

                            <button id="resetDataBtn" class="w-full bg-rose-50 text-rose-600 font-bold py-2.5 rounded-xl text-xs hover:bg-rose-100">
                                데이터 및 유리병 초기화
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function initMyPageTabEvents() {
            const openRetest = () => showOnboardingQuiz();

            const retest1 = document.getElementById('retestQuizBtn');
            if (retest1) retest1.onclick = openRetest;

            const retest2 = document.getElementById('retestQuizBtn2');
            if (retest2) retest2.onclick = openRetest;

            document.getElementById('openMateTabShortcut').onclick = () => switchTab('mate');
            document.getElementById('mateHeartCheerBtn').onclick = () => {
                showToast('수아에게 따뜻한 응원을 보냈습니다!');
            };

            // Custom Styled Dropdown Events
            const dropdownBtn = document.getElementById('customNotifDropdownBtn');
            const dropdownMenu = document.getElementById('customNotifMenu');

            if (dropdownBtn && dropdownMenu) {
                dropdownBtn.onclick = (e) => {
                    e.stopPropagation();
                    dropdownMenu.classList.toggle('hidden');
                };

                document.addEventListener('click', (e) => {
                    if (!dropdownBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
                        dropdownMenu.classList.add('hidden');
                    }
                });

                document.querySelectorAll('.notif-opt-btn').forEach(btn => {
                    btn.onclick = () => {
                        STATE.notifications = btn.dataset.val;
                        saveStorage();
                        dropdownMenu.classList.add('hidden');
                        showToast('알림 주기 설정이 변경되었습니다.');
                        renderTab('mypage');
                    };
                });
            }

            document.getElementById('toggleSoundBtn').onclick = () => {
                STATE.soundEffects = !STATE.soundEffects;
                saveStorage();
                showToast(`효과음/진동이 ${STATE.soundEffects ? '켜졌습니다' : '꺼졌습니다'}.`);
                renderTab('mypage');
            };

            document.getElementById('toggleShareBtn').onclick = () => {
                STATE.shareStatus = !STATE.shareStatus;
                saveStorage();
                showToast(`메이트 활동 공개가 ${STATE.shareStatus ? '켜졌습니다' : '꺼졌습니다'}.`);
                renderTab('mypage');
            };

            document.getElementById('resetDataBtn').onclick = () => {
                localStorage.removeItem('tickle_app_v11');
                STATE.tickles = [...INITIAL_TICKLES];
                STATE.routines = [...INITIAL_ROUTINES];
                STATE.userPersona = 'achievement';
                saveStorage();
                showToast('모든 데이터가 초기화되었습니다.');
                showOnboardingQuiz();
            };
        }

        // ========================================================
        // 6. MODALS & TOAST
        // ========================================================
        function showAddTickleModal() {
            const overlay = document.getElementById('onboardingOverlay');
            const card = document.getElementById('onboardingCard');
            overlay.classList.remove('hidden');

            card.innerHTML = `
                <div class="space-y-3">
                    <div class="flex justify-between items-center pb-1">
                        <h3 class="text-sm font-bold text-stone-800">티끌 하나 담기</h3>
                        <button onclick="closeModal()" class="text-stone-400 p-1">✕</button>
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-stone-600 block mb-1">오늘 이룬 작은 성취를 적어주세요</label>
                        <input type="text" id="tickleTitleInput" placeholder="예) 따뜻한 물 한 잔 마시기" class="w-full bg-stone-50 rounded-xl p-3 text-xs font-medium focus:outline-none">
                    </div>
                    <button id="submitTickleBtn" class="w-full bg-brand-orange text-white font-bold py-3 rounded-xl text-xs">
                        유리병에 넣기
                    </button>
                </div>
            `;

            document.getElementById('submitTickleBtn').onclick = () => {
                const val = document.getElementById('tickleTitleInput').value.trim();
                if (val) {
                    const newT = { id: 't_' + Date.now(), title: val, theme: STATE.theme };
                    STATE.tickles.push(newT);
                    saveStorage();
                    closeModal();
                    if (threeApp) threeApp.addSingleObject(newT);
                    showToast('유리병에 새로운 3D 티끌이 담겼습니다!');
                    renderTab('jar');
                }
            };
        }

        function showAddRoutineModal() {
            const overlay = document.getElementById('onboardingOverlay');
            const card = document.getElementById('onboardingCard');
            overlay.classList.remove('hidden');

            card.innerHTML = `
                <div class="space-y-3">
                    <div class="flex justify-between items-center pb-1">
                        <h3 class="text-sm font-bold text-stone-800">새 티끌 루틴 추가</h3>
                        <button onclick="closeModal()" class="text-stone-400 p-1">✕</button>
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-stone-600 block mb-1">부담 없는 작은 목표 이름</label>
                        <input type="text" id="routineTitleInput" placeholder="예) 책 2페이지 읽기" class="w-full bg-stone-50 rounded-xl p-3 text-xs font-medium focus:outline-none">
                    </div>
                    <button id="submitRoutineBtn" class="w-full bg-brand-orange text-white font-bold py-3 rounded-xl text-xs">
                        추가하기
                    </button>
                </div>
            `;

            document.getElementById('submitRoutineBtn').onclick = () => {
                const val = document.getElementById('routineTitleInput').value.trim();
                if (val) {
                    STATE.routines.push({ id: 'r_' + Date.now(), title: val, category: '나만의 루틴', completed: false });
                    saveStorage();
                    closeModal();
                    showToast('새 티끌 루틴이 추가되었습니다.');
                    renderTab('routines');
                }
            };
        }

        function closeModal() {
            document.getElementById('onboardingOverlay').classList.add('hidden');
        }

        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'bg-stone-800 text-white text-xs font-bold px-4 py-2 rounded-full border border-stone-700 transition-all duration-300 opacity-100 text-center max-w-[310px]';
            toast.innerText = msg;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2200);
        }

        window.onload = () => {
            initApp();
        };
    </script>
</body>
</html>
